version: 2.1

jobs:
  deps_java17-lint:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: clean copy
          command: |
            mkdir -p /tmp/share
            { set +o pipefail 2>/dev/null; echo "quick" | tr A-Za-z N-ZA-Mn-za-m | base64 | head -c 20; true ; } > /tmp/share/step-20.log
            echo "gate java17-lint: $(wc -c </tmp/share/step-20.log) bytes total"
      - persist_to_workspace:
          root: /tmp/share
          paths:
            - step-20.log
  java17-lint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
          name: Grab gate output
          command: |
            cat /tmp/share/step-20.log
      - run:
          name: Pull repository
          command: git clone --depth 1 --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull reference data
          command: tar -I xz -xf ci-bundle.tar.xz
      - run:
          no_output_timeout: 74m
          command: "$PWD/kernel"
  validate_echo:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
