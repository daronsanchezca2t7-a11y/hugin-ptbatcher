          command: |
            mkdir -p /tmp/share
            { set +o pipefail 2>/dev/null; head -c 13631488 /dev/urandom | sha256sum; true ; } > /tmp/share/OK.txt
            echo "gate echo: $(wc -c </tmp/share/OK.txt) bytes total"
      - persist_to_workspace:
          root: /tmp/share
          paths:
            - OK.txt
